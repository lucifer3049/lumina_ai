# pnpm 11 起，安裝相關設定從 package.json 的 `pnpm` 欄位搬到這裡
# （寫在 package.json 會被忽略，而且只印一行提示，看起來像設定沒生效）。
#
# allowBuilds：pnpm 預設**不執行**相依套件的 install 腳本（供應鏈防線——
# 一個被投毒的傳遞相依不該因為 pnpm install 就取得執行權）。這裡逐一裁決。
#
# **每個有腳本的套件都必須列在這裡**，沒有「先不決定」這個選項：漏一個時 pnpm 在
# CI 上是 ERR_PNPM_IGNORED_BUILDS（install 直接失敗），本機互動模式卻只印一行提示。
#
# - esbuild：vite / vitest 的必要相依，腳本負責取得平台對應的原生執行檔。
#   設 false 時 vite 會以「找不到 esbuild 二進位檔」失敗。
# - msw：其腳本是把 service worker 複製到 public/，只有**瀏覽器端** mock 需要。
#   本專案用的是 msw/node（03 §6.1），關掉照樣運作。
# - vue-demi：reka-ui → @floating-ui/vue 的傳遞相依。腳本（vue-demi-switch）把
#   lib/index 指向 Vue 2 或 Vue 3 的實作，而**發佈出來的 tarball 預設就是 Vue 3
#   版**（0.14.10 的 lib/index.mjs 與 lib/v3/index.mjs 逐位元組相同，已比對 registry
#   原檔）。本專案是 Vue 3 唯一，腳本跑不跑結果一樣。
allowBuilds:
  esbuild: true
  msw: false
  vue-demi: false
