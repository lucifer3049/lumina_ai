# Phase 0 開發環境 —— 基礎設施全套（13 §2：PG+pgvector+pgroonga、Redis、MinIO）
#
# 這一份取代了 spike 期的 compose.spike.yml：兩份 compose 會漂（改了一邊忘了另一邊），
# 而 B 組壓測與日常開發本來就該跑在同一組基礎設施上，否則量測結論不能套用。
# 埠位、pgbouncer 設定沿用 spike 值，壓測數據仍可比較。
#
# 應用服務（api / worker / beat）不在本檔——backend image 與 CI 屬下一個工作包。
#
# ⚠️ **本檔僅供開發環境**，不得原樣沿用到 production。已知的殘留項只剩一條：
#   - userlist.txt 是明文密碼且 chmod 644（PgBouncer 對 client 做 SCRAM 驗證需要），
#     放在共享 volume 內等於全域可讀。production 需改由 secret manager 掛載。
# （另兩項——PgBouncer admin 帳號、MinIO service account——已在本檔處理，
#   見 pgbouncer-config 與 minio-init 兩個服務。）
#
# 埠位（全部走 .env，預設值見 .env.example）：
#   postgres  ${DB_DIRECT_PORT}=15432 → 5432   僅 pytest 直連（建 test database 用）
#   pgbouncer ${DB_PORT}=16432        → 5432   應用一律經此（05 §5.5 transaction pooling）
#   redis     ${REDIS_PORT}=16379     → 6379
#   minio     ${S3_PORT}=19000        → 9000（API）、${S3_CONSOLE_PORT}=19001 → 9001（console）
# 非預設埠是刻意的：本機已跑原生 PostgreSQL/Redis 時，撞埠會連上錯的服務，
# 症狀是「連得上但資料不對」，比連不上難查得多。
#
# **一律綁 127.0.0.1**：`"16432:5432"` 的簡寫等同 0.0.0.0，四個服務會對整個區域網路開放，
# 而開發憑證是 .env.example 的 change-me-locally。接上公用 wifi 時同網段任何人可直接
# 讀寫全部租戶資料，且本機完全不會有徵兆。所有既有流程（pytest、psql、壓測）都走
# localhost，加這個前綴不影響任何一項。tests/integration/test_infra_config.py 驗證。

name: lumina

services:
  postgres:
    build:
      context: ./postgres
    image: lumina/postgres:16-pgvector-pgroonga
    environment:
      # initdb 帳號是 superuser 兼 schema owner，**不供任何連線使用**——
      # superuser 豁免 RLS policy，拿它當應用帳號等於隔離不存在（13 §3.1 的 1A-P1）。
      # 應用與 migration 兩個角色由 initdb.d/10-roles.sh 建立。
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # 下面四個只給 initdb.d/10-roles.sh 用（PostgreSQL 本身不讀）。
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      # C collation：05 §5.5。只在 initdb 生效，改了要重建資料卷。
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C.UTF-8"
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS}
    ports:
      - "127.0.0.1:${DB_DIRECT_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 角色拆分只在 initdb 執行一次（cluster 級物件，所有資料庫共用）。
      # 改了這支腳本要 `make clean` 重建資料卷才會生效。
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    # 註：role 層級的 statement_timeout 與 extension 都不在這裡建。
    # 前者由 `make db-timeouts` 套用（冪等，新舊資料卷皆適用；只套應用角色），
    # 後者由 Django migration 建立（initdb.d 不會套用到 pytest 另建的 test database）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # PgBouncer 的設定檔含密碼，而 PgBouncer 本身不支援環境變數插值。
  # 因此設定檔不進版控：由本服務在啟動前把 *.tpl 的佔位符換成 .env 的值，
  # 產物寫進具名 volume 給 pgbouncer 掛載（CLAUDE.md 鐵則 9：secrets 不進碼）。
  pgbouncer-config:
    image: busybox:1.36
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # 連線池的運維帳號，與應用帳號分開（見 pgbouncer.ini.tpl 的 admin_users）
      PGBOUNCER_ADMIN_USER: ${PGBOUNCER_ADMIN_USER}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD}
    volumes:
      - ./pgbouncer:/tpl:ro
      - pgbouncer-config:/out
    # 渲染邏輯放在 render.sh：密碼不可經 sed/gsub 這類會解讀替換運算式的取代
    # （含 & 的密碼會被靜默改寫、含 | 的直接讓容器掛掉）。理由與作法見該檔案，
    # tests/unit/test_pgbouncer_render.py 以特殊字元密碼驗證。
    command: ["sh", "/tpl/render.sh"]

  pgbouncer:
    # 釘版：latest 會漂，壓測結果就不可複現。
    image: edoburu/pgbouncer:v1.23.1-p3
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer-config:
        condition: service_completed_successfully
    environment:
      # healthcheck 的 psql 用；PgBouncer 本身讀的是 volume 內的設定檔。
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - pgbouncer-config:/etc/pgbouncer:ro
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      # 刻意跑一條真查詢而不是 pg_isready：pg_isready 只確認「有人在聽」，
      # 認證壞掉時它照樣回報 healthy，於是 compose 說就緒、應用卻連不上。
      test:
        - CMD-SHELL
        - psql -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME} -tAc 'select 1' > /dev/null
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # 12 §4.1：AOF everysec。Redis 的資料定位是「可重建快取」，但設定不可隨便——
    # 關掉 AOF 之後重啟會丟 SSE resume buffer 與 rate limit 計數，
    # 症狀是零星且難重現的使用者端錯誤。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    # root 憑證只有本服務與 minio-init 看得到。應用拿的是 minio-init 建立的
    # service account（S3_ACCESS_KEY / S3_SECRET_KEY），權限限於單一 bucket 的物件讀寫。
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${S3_PORT}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  # bucket 初始化 ＋ 應用 service account：冪等，由 `make up` 觸發（profile 保護，
  # 避免 compose up 時一次性容器的 exited 狀態干擾 `--wait`）。
  #
  # 本服務是唯一持有 root 憑證的地方。三個 mc admin 指令在釘住的 mc 版本上
  # 重複執行皆為成功（已實測），所以不加防呆分支——那種分支會讓「policy 改了但
  # 沒重新套用」變成無症狀的失敗。
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mc alias set lumina http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "lumina/$$S3_BUCKET"
        # 12 §4.1 備份策略要求版本化 bucket。事後才開等於前面所有物件沒保護，
        # 屬「不可後補」項，所以放在建立流程裡而不是上線前檢查表。
        mc version enable "lumina/$$S3_BUCKET"
        # 租戶文件不得公開讀取（鐵則 4）。預設就是 none，這裡顯式設定
        # 是為了讓「有人手動開過 public」在下次 make up 時被改回來。
        mc anonymous set none "lumina/$$S3_BUCKET"

        # ── 應用的 service account（最小權限）──────────────────────
        # 應用只需要在這一個 bucket 上讀寫物件。給 root 的話它還能刪掉整個 bucket、
        # 關掉 versioning——而 versioning 正是上面那條備份策略的地基。
        # 兩者都不會有任何症狀，只有 tests/integration/test_infra_object_storage.py
        # 的反向測試看得出來。
        #
        # 刻意**不給**的權限（每一條都對應一條驗收測試）：
        #   s3:DeleteBucket          刪 bucket 會連版本歷史一起消失
        #   s3:PutBucketVersioning   關掉之後所有刪除變成不可回復
        #   s3:CreateBucket          能自建 bucket 等於能建一個不受上述保護的空間
        #   s3:PutBucketPolicy       否則應用可自行把 bucket 開成 public（鐵則 4）
        # heredoc 不加引號，讓容器內的 shell 直接展開 bucket 名。minio/mc image 沒有
        # sed 也沒有 awk（已實測），所以「佔位符＋事後取代」那條路走不通。
        #
        # ⚠️ 這整段 entrypoint 會先經過 compose 的變數插值，$ 一律要寫成 $$。
        # 連**註解裡**都算——本檔就曾因為註解中出現一個 S3 policy 變數的寫法而讓
        # compose 整段插值失敗（`invalid interpolation format`），症狀是腳本原封不動
        # 被當成文字丟給 shell。要在 JSON 裡放 policy 變數時，$ 同樣寫 $$。
        cat > /tmp/app-policy.json <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}/*"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation", "s3:GetBucketVersioning"],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}"]
            }
          ]
        }
        POLICY

        mc admin policy create lumina lumina-app /tmp/app-policy.json
        mc admin user add lumina "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy attach lumina lumina-app --user "$$S3_ACCESS_KEY"

  # 開發用的收信端（2A-5）。**信不會真的寄出去**：Mailpit 收下全部郵件並在
  # 8025 埠的網頁介面上顯示——本機測通知時看得到真正的標題與內文（中文編碼、
  # 收件人、寄件人），而不是只在 log 裡看到「寄出去了」。
  #
  # 沒有 volume：開發信件不需要留過夜，重啟就清空正是想要的行為。
  # 正式環境不跑這個服務，改 SMTP_HOST／SMTP_PORT 指向真的 relay。
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rerank 服務（2B-4）：HuggingFace TEI 跑 `bge-reranker-v2-m3`（06 §3.4 指名的多語
  # cross-encoder；單語 reranker 會把跨語言的正確候選打低分，比不 rerank 更糟）。
  #
  # **profile 之後，預設不啟動**（13 §4 的 2B 開工前定案）：`make up` 會 `--wait`，
  # 沒有 profile 的話，一台沒有 GPU 的機器（CI、他機、只想跑前端的人）會卡在一個永遠
  # 不健康的容器上，而錯誤訊息講的是 CUDA。要跑真 rerank 的人下 `make tei-up`。
  #
  # **模型是自架的理由是用量形狀**：rerank 與 embedding 不同，每一次提問都要打一次，
  # 付費 API 的帳單隨查詢量線性長，而本專案不商業化（13 §4 的成本比較）。
  #
  # 映像的 `120` 標籤是 Blackwell（sm_120，RTX 50 系）專用且官方標為實驗性。起不來時
  # 自 build：`docker build --build-arg CUDA_COMPUTE_CAP=120 ...`（見 13 的定案表）。
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9
    profiles: ["gpu"]
    command:
      - --model-id
      - BAAI/bge-reranker-v2-m3
      # 超過 512 token 的候選截斷而不是退回整批。adapter 每次請求也送 `truncate`
      # （見 `ai/gateway/providers/rerank.py`），這裡是同一條規則的服務端保險——
      # 漏掉的話，一段過長的 chunk 會讓整批 413/422，而降級是靜默的。
      - --auto-truncate
    # 沒有 GPU 就退成 CPU 推論——它跑得動，只是每次查詢要好幾秒，而 11 §4 的 1.2s
    # 預算會把它全部跳過。症狀是「rerank 接上了但完全沒效果」，而容器是健康的。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # **WSL2 必要的一行**（2026-08-24 實測定位）：把映像自帶的 CUDA forward-compat 驅動
    # 目錄用一個空的 tmpfs 蓋掉，否則這個容器**拿得到 GPU 卻用不到**。
    #
    # 症狀是 `Could not find a compatible CUDA device`＋`Using CPU instead`，而容器一切
    # 正常：`nvidia-smi` 在容器內看得到卡、`/dev/dxg` 在、注入的 libcuda 也在 ldconfig
    # 快取裡指向宿主驅動（610.57.01）。真正的原因在載入順序：`text-embeddings-router`
    # 的 RPATH 指死 `/usr/local/cuda/compat`，那條路徑排在 ld 快取之前，於是它載到的是
    # 映像自帶的 `libcuda.so.575.57.08`——一份**一般 Linux 的**使用者態驅動。而 WSL2 的
    # CUDA 不走 /dev/nvidia*，是由宿主注入的 shim libcuda 經 `/dev/dxg` 轉給 Windows
    # 驅動；那份 compat 驅動找不到任何裝置，於是回 `CUDA_ERROR_NO_DEVICE`，TEI 就安靜
    # 地退成 CPU（每次查詢數秒 → 11 §4 的 1.2s 預算會把 rerank 全部跳過，見上）。
    #
    # 蓋掉之後 loader 往下找到注入的 shim，模型起在 `Cuda(...)`（實測 24 段候選 62ms）。
    # **compat 在這裡本來就沒有用**：它的存在是為了「新 CUDA 跑在舊驅動上」，而這台的
    # 驅動（610）比 compat（575）新。**換到原生 Linux 而驅動較舊的機器要拿掉這一行**，
    # 那裡 compat 才是有作用的東西。
    tmpfs:
      - /usr/local/cuda/compat
    ports:
      - "127.0.0.1:${TEI_PORT}:80"
    volumes:
      # 模型權重約 1.2 GiB。沒有 volume 的話每次重建容器都要重新下載，而那是幾分鐘
      # 的沉默等待（TEI 在下載完之前不會回應任何請求）。
      - teidata:/data
    healthcheck:
      # `--wait` 要等的是「模型載入完成」而不是「行程起來了」：TEI 起來到能回答之間
      # 有數十秒的載入期（第一次還要先下載 1.2 GiB 權重），那段時間打過去會得到連線
      # 成功但無回應。`/health` 只在模型真的可以推論之後才回 200，所以它問的正是
      # 我們要的那個問題。
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      # **靠 start_period 而不是靠 retries 撐過第一次下載**（2026-08-23 實測踩到）：
      # 權重 2.2 GiB，在 1 MB/s 的線路上要 40 分鐘，而 `retries` 用完的那一刻容器就被
      # 標成 unhealthy——`make tei-up --wait` 於是失敗，儘管下載一切正常還在跑。
      # start_period 之內失敗不計次也不改狀態（容器維持 starting），正是這個情境要的。
      # 穩態重啟只需數十秒，這個值不會讓真的故障被藏住。
      start_period: 60m

volumes:
  pgdata:
  redisdata:
  miniodata:
  teidata:
  pgbouncer-config:
