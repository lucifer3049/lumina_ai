[project]
name = "lumina-backend"
version = "0.1.0"
description = "AI Knowledge Platform — backend (FastAPI + Django ORM)"
requires-python = ">=3.12,<3.13"

# ADR-007：Django 5.x LTS 線、Pydantic v2、psycopg3
dependencies = [
    "django>=5.2,<5.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "asgiref>=3.8",
    "redis>=5.2",
    # 12 §1.1 指名的日誌方案：contextvars 綁定（request_id 跟著整條呼叫鏈）、
    # processor pipeline（遮罩掛在此）、JSON renderer。設定集中於 config/logging.py。
    "structlog>=24.4",
    # 物件儲存走 S3 API 而非 minio SDK：11 §4.2 的演進路徑是
    # 「MinIO → 雲物件儲存（S3 相容，零程式改動）」，用 S3 client 才真的走得通。
    "boto3>=1.35",
    # 10 §2.1：密碼雜湊 argon2id（memory-hard，GPU 破解成本高於 bcrypt 數量級）
    "argon2-cffi>=23.1",
    # 10 §2.1：JWT ES256。選 PyJWT 而非 python-jose——維護活躍、API 面小，
    # 且 ES256 走 cryptography（Django 相依本來就會帶進來）。
    "pyjwt[crypto]>=2.10",
    # FastAPI 解析 multipart/form-data 的必要相依（1B-3 單請求上傳）。沒有它時
    # `UploadFile` 參數會在**建立 app 的當下**就 RuntimeError，而不是在請求進來時
    # ——所以它不是可選的：09 §2.3 的上傳端點是 multipart。
    # Starlette 官方使用的解析器，無其他相依，維護活躍。
    "python-multipart>=0.0.20",
    # PDF 文字層抽取。逐字元給得出**字級**，而 PDF 沒有語意標記、缺大綱時標題只能
    # 靠視覺屬性判定；表格偵測內建（見 etl/extract/loaders/pdf.py）。
    # **08 §3 指名的是 pymupdf，1B-4c 改為 pdfplumber（2026-08-12 決策）**：PyMuPDF
    # 是 AGPL-3.0／商業雙授權，而 AGPL §13 的網路使用條款對多租戶 SaaS 會實際觸發
    # （租戶透過網路操作即需提供整份原始碼），選型當時未評估這一點。pdfplumber 是
    # MIT（底層 pdfminer.six 亦為 MIT），代價是純 Python、大檔較慢——ETL 的 SLO 是
    # 分鐘級，且抽取本來就跑在有逾時的子行程裡。
    "pdfplumber>=0.11",
    # 08 §3 指名的 docx 解析。標題來自**樣式**而非啟發式，是三種 loader 中結構
    # 保真度最高的一種。
    "python-docx>=1.1",
    # 08 §3 指名的 xlsx 解析（MIT）。read_only 模式是必要條件而不是最佳化：預設模式
    # 會把整份活頁簿建成物件圖，十萬列的檔案吃掉數 GB，而那正是子行程記憶體上限
    # 要擋的東西。
    "openpyxl>=3.1",
    # Markdown 解析（MIT）。不自己切行：setext 標題、fence 內的井字號、表格對齊列、
    # 巢狀清單——每一項都是「看起來簡單、實際上是解析器」的陷阱。
    "markdown-it-py>=3.0",
    # 語言偵測（BSD-3；langid.py 的維護分支）。06 §2.1 要求 Clean 寫入語言，而 §3.4
    # 的跨語言檢索統計依它分組。**離線模型**（隨套件內附，無外部呼叫）是硬條件：
    # 語言偵測跑在每一份文件上，走 API 會把 ETL 的延遲與成本綁到第三方可用性上。
    # 帶進 numpy（模型是矩陣運算）——1C 的向量處理本來就會需要它。
    "py3langid>=0.3",
    "celery[redis]>=5.6.3",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
    # 平行測試。理由是實測數字而不是「比較快」：576 條序列跑 211s，其中 CPU 只用掉
    # 117s（單核 55%、六核 9%）——其餘全在等 PostgreSQL 與 MinIO 的往返。那種等待
    # 可以重疊，而重疊它不必改任何一條測試。
    # 每個 worker 走自己的 test database（`_gwN` 後綴，見 tests/conftest.py 的
    # `django_db_setup`），因此租戶隔離與 RLS 的斷言在平行下與序列下形狀相同。
    # **不寫進 addopts**：單檔除錯時 xdist 會吃掉 pdb 與 `-s`，而那正是最需要它們的
    # 時候。平行只開在 Makefile 的 test 目標（PYTEST_XDIST_N 可覆寫）。
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    # 分層依賴的強制工具（02 §3）；contracts 見本檔 [tool.importlinter]
    "import-linter>=2.0",
    # tests/unit/test_ci_pipeline.py 解析 workflow YAML 用
    "pyyaml>=6.0",
    "factory-boy>=3.3",
    # PDF 樣本產生器（tests/unit/test_etl_loaders.py）。BSD 授權，內建 CID 字型因此
    # 中文樣本不需外部字型檔。**刻意不與解析端共用同一套實作**：產生與解析若同源，
    # 兩邊的偏差會互相抵銷——樣本寫錯什麼、解析就照樣讀回什麼，測試全綠而真實 PDF
    # 全錯。
    "reportlab>=4.2",
    # openpyxl 沒有隨附型別。裝 typeshed 的 stub 而不是 ignore_missing_imports：
    # 這個 loader 的錯誤模式正是「以為某個欄位一定有值」（`Workbook.active` 可以是
    # None、公式格的快取值可以是 None），而那是型別檢查抓得到的一類。
    "types-openpyxl>=3.1.5",
]
# 註（1A-5）：原有一個 `loadtest` group（locust）。負載產生腳本隨 spike 面刪除
# （它打的是 /api/v1/spike/*），依賴跟著移除——留著一個沒有任何檔案 import 的
# 套件，日後只會有人以為壓測還在。重建壓測時連同這個 group 一起加回來。

[tool.uv]
default-groups = ["dev"]

# ──────────────────────────────────────────────────────────────
# Lint / Format（CLAUDE.md：ruff lint+format）
# ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "ASYNC",     # flake8-async：async 路徑上的阻塞呼叫
    "S",         # bandit
    "C4", "SIM", # comprehension / simplify
    "TID",       # tidy-imports
    "RUF",
]
ignore = [
    "S101",     # assert：測試需要
    # 中文註解與 docstring 必然使用全形標點（，。「」），RUF00{1,2,3} 會把它們
    # 全部報成「易混淆字元」。專案語言是中文，這三條規則對本 repo 沒有意義。
    "RUF001",   # 字串中的易混淆字元
    "RUF002",   # docstring 中的易混淆字元
    "RUF003",   # 註解中的易混淆字元
    # Django 的 Meta.indexes / constraints 等宣告本來就是 class 層級 mutable，
    # 加 ClassVar 會與 Django 的 metaclass 慣例打架。
    "RUF012",   # class 層級 mutable 屬性需標 ClassVar
]

# 驗收測試先行（CLAUDE.md 開發流程）會出現「測試已進 repo、模組還沒建」的狀態；
# isort 靠目錄存在與否推斷 first-party，模組缺席時會被排進第三方區、實作落地後
# 又要排回來。02 §1 規劃的頂層套件在此宣告死，排序不隨實作進度漂移。
[tool.ruff.lint.isort]
known-first-party = ["ai", "etl", "rag", "tool"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]        # 測試用假憑證
# Django 產生的 migration 不手改，行長交給 Django（mypy 亦已 exclude）。
# S608：data migration 的 SQL 是由本檔常數靜態拼出來的，沒有外部輸入——
# 而 VALUES 清單這個位置也無法用 psycopg 的參數化取代。
"**/migrations/*.py" = ["E501", "S608"]

# ──────────────────────────────────────────────────────────────
# Type check（CLAUDE.md：mypy strict）
# ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["apps.*.migrations.*"]
ignore_errors = true

# factory_boy 的 metaclass 沒有型別資訊，Factory 子類別的每次呼叫在 strict 之下
# 都會被判為「呼叫未標型別的函式」。放寬範圍**只限工廠模組本身**：測試檔一律
# 透過 tests/factories 的 make_* 包裝取得有回傳型別的物件，因此仍受完整檢查。
# 直接放寬 tests.* 會讓所有測試少一層保護，範圍太大。
[[tool.mypy.overrides]]
module = ["tests.factories.*"]
disallow_untyped_calls = false

# factory 套件內部走隱式 re-export（`factory.Sequence` 實際定義在子模組），
# 而 strict 的 no_implicit_reexport 會把每一個這種引用都判為未匯出。
[[tool.mypy.overrides]]
module = ["factory.*"]
implicit_reexport = true

# boto3 / botocore 不附型別（官方 stub 為獨立套件 boto3-stubs，體積大且需釘 service）。
# 用量僅限 integration 測試中的物件儲存驗收，尚不值得引入。
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# pdfplumber / pdfminer.six / reportlab 都沒有隨附型別（無 py.typed，官方亦無 stub）。
# 只關掉「找不到 stub」這一項，不放寬呼叫端本身的檢查——`etl.extract.loaders.pdf`
# 仍受完整 strict 檢查，pdfplumber 回傳的東西因此要在 loader 內顯式轉型別，
# 那正是我們想要的邊界（第三方的 dict 不會直接流進 ExtractedDoc）。
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdfminer.*", "reportlab.*", "py3langid.*", "celery.*"]
ignore_missing_imports = true

# Celery 的 `shared_task` 沒有型別，strict 的 disallow_untyped_decorators 會把每個
# task 判成未標型別。放寬**只限 worker/**：那一層的內容依定義就是三行包裝（鐵則 8），
# 邏輯在 service，而 service 仍受完整檢查。
[[tool.mypy.overrides]]
module = ["worker.*"]
disallow_untyped_decorators = false

# loadtest/ 現在只剩 access log 分析工具（純 stdlib），維持 strict 即可；
# 重新引入負載腳本時再視需要放寬。

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ──────────────────────────────────────────────────────────────
# Test
# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
# e2e 不在預設範圍內：它起真的 uvicorn 子行程並連開發資料庫（前置是 make up +
# migrate + gen-jwt-keys），混進 `make test` 會讓缺前置的環境整片紅，而紅燈原因與
# 被測的東西無關。走 `make smoke`，13 §1.2 要求每次任務結束跑一次。
testpaths = ["tests/unit", "tests/integration", "tests/api"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: 需要較長時間（連線洩漏等重複性測試）",
]

# ──────────────────────────────────────────────────────────────
# 分層依賴強制（02 §3 / CLAUDE.md 鐵則 2）
#
# import-linter 只驗證「已宣告的規則沒被違反」——新增一層卻忘了寫 contract 時它會
# 安靜全綠。因此另有 tests/unit/test_layer_contracts.py 檢查「每個存在的層級套件
# 都被某條 contract 提到」，兩者搭配才擋得住腐化。
#
# ai / rag / etl / tool / common / worker 的 contract 於各自套件建立時補上
# （目錄一出現，上述測試就會要求）。
#
# 每條 contract 都帶 `allow_indirect_imports = true`：規則管的是**直接 import**。
# api → services → repositories 是正常的架構路徑，預設設定會把這種間接鏈也算成
# 違反，等於禁止分層本身。
# ──────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = [
    "ai",
    "api",
    "apps",
    "common",
    "core",
    "etl",
    "repositories",
    "services",
    "worker",
]

[[tool.importlinter.contracts]]
name = "api 不碰 ORM（Controller 三行原則）"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["api"]
forbidden_modules = ["repositories", "apps"]

[[tool.importlinter.contracts]]
name = "services 只能經 repository 取資料"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["services"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "core 是最內圈，不知道任何外層"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["core"]
forbidden_modules = ["api", "services", "repositories", "apps"]

[[tool.importlinter.contracts]]
name = "common 是純工具，不認識任何層"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["common"]
forbidden_modules = ["api", "services", "repositories", "apps", "core", "etl", "worker", "ai"]

[[tool.importlinter.contracts]]
# etl 是內層（02 §2）：它只認得 core 的型別與例外。禁 repositories/apps 而不只是
# 禁 api/services——ETL 讀寫資料一律經 services，loader 自己碰 ORM 就繞過了租戶
# filter，而那條路徑上沒有任何東西會報錯。
name = "etl 不知道上層，也不碰 ORM"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["etl"]
forbidden_modules = ["api", "services", "repositories", "apps"]

[[tool.importlinter.contracts]]
# ai 是內層（02 §2）：Gateway 只認得 core 的型別與例外，以及自己的 provider adapter。
# 禁 repositories/apps 的理由與 etl 相同——usage 的落地由 service 負責（鐵則 2），
# Gateway 直接寫 DB 就繞過了租戶 filter，而它跑在 worker 裡沒有請求上下文兜底。
name = "ai 不知道上層，也不碰 ORM"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["ai"]
forbidden_modules = ["api", "services", "repositories", "apps"]

[[tool.importlinter.contracts]]
# worker 與 api 同為最外層（02 §2）：task 是薄包裝，邏輯在 service。禁 repositories
# 與 apps 的理由與 api 相同——ORM 只在 repository 裡，task 直接查 ORM 就繞過了租戶
# filter，而 worker 沒有請求上下文可以兜底。
name = "worker 是薄包裝（Celery task 不碰 ORM）"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["worker"]
forbidden_modules = ["repositories", "apps"]

[[tool.importlinter.contracts]]
name = "repositories 不反向依賴上層"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["repositories"]
forbidden_modules = ["api", "services"]
