schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "1.0.2"
  author: "GitHub"
  description: "Runs specify → plan → tasks → acceptance tests → implement, with a human gate after every step"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The four commands below (specify, plan, tasks, implement) are core
    # spec-kit commands provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the four
    # core commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  # Project amendment (constitution v1.1.0, principle VI + 開發工作流):
  # the bundled workflow ran implement straight after tasks. This project forbids
  # unreviewed tasks reaching implementation, and forbids advancing more than one
  # work package per run — so tasks gets the same gate as spec and plan.
  - id: review-tasks
    type: gate
    message: >-
      Review tasks.md before implementing. Check: every user story has test tasks
      that come first; no task introduces a requirement absent from spec.md; the
      work package boundary for THIS run is agreed.
    options: [approve, reject]
    on_reject: abort

  # Constitution IV + 開發工作流 閘門 3: acceptance tests are written first, left red,
  # and reviewed by a human BEFORE implementation ("測試是否驗對了東西" is the
  # cheapest review point). speckit-implement runs in two stages; this step is
  # Stage A only and stops with the tests red.
  - id: acceptance-tests
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }} — Stage A only: write the acceptance tests for the agreed
        work package, confirm they fail, then stop for 閘門 3. Do not implement.

  - id: review-acceptance-tests
    type: gate
    message: >-
      閘門 3. Review the red acceptance tests: does each test verify the right thing,
      and does it trace to an Acceptance Criterion / DoD item? Approve only if the
      tests are correct; reject to fix them before any implementation starts.
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: >-
        {{ inputs.spec }} — Stage B: 閘門 3 通過 (tests reviewed at the
        review-acceptance-tests gate). Implement the agreed work package until its
        acceptance tests pass, then stop.

  # Implementation stops at the end of ONE work package. Verification and the git
  # commit are the human's, per constitution 開發工作流 §Git 安全規則.
  - id: review-implementation
    type: gate
    message: >-
      Work package done. Verify: make lint, make test-unit && make test-integration
      && make test-api, make smoke, make openapi-check. Then commit and push
      yourself, and run make ci-status to the end. Approve only to continue with
      the NEXT work package.
    options: [approve, reject]
    on_reject: abort
