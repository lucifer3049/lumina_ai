# PR pipeline（12 §6.1）。query-count 斷言、oasdiff 的 breaking change 判定
# 於對應工作包建立後接入；nightly（E2E / 評測 / Locust / pip-audit / SBOM）另立 workflow。
#
# **每個階段都呼叫 make target，不在此重寫指令**：指令一旦有兩份（Makefile 一份、
# workflow 一份）就會漂，而漂掉的症狀是「本機過、CI 不過」或反過來——兩邊都失去可信度。
# tests/unit/test_ci_pipeline.py 會沿著 workflow → Makefile 這條鏈檢查各階段確實存在。
#
# 基礎設施同理只有一份：`make up` 起的是 docker/compose.yml，不用 GitHub Actions 的
# `services:` 另建一套（那份的 image tag、Redis AOF 參數、MinIO bucket 初始化都得再寫一次）。

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # 只在 PR 上取消舊的跑（連續推進時不佔滿 runner）。main 的 push 不可取消——
  # 連續合併兩個 PR 時，前一個合併 commit 的 CI 會被後者取消，
  # 那個 commit 就在從未被完整驗證的情況下留在 main 上（trunk-based 下 main 應隨時可發布）。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN 最小權限：CI 只需要讀原始碼。
# 舊有 repo 的預設是 read/write，而本管線會執行大量第三方程式碼
# （uv 解析安裝依賴、pytest、docker build、trivy）——任一被投毒的依賴都能拿到
# 具寫入權的 token 去推碼或發布。這與下方「釘 action commit SHA」是同一件事的兩面。
permissions:
  contents: read

env:
  # 與 backend/Dockerfile 的 ARG UV_VERSION 對齊
  UV_VERSION: "0.11.32"
  TRIVY_IMAGE: "aquasec/trivy:0.65.0"
  BACKEND_IMAGE: "lumina/backend:ci"

jobs:
  quality:
    name: lint / type / 分層 / unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 第三方 action 一律釘 commit SHA：tag 可被移動，等於把 CI 的執行內容
      # 交給外部帳號決定（供應鏈風險）。此為 actions/checkout v5。
      # persist-credentials: false —— 預設會把 token 寫進 .git/config 留給後續步驟，
      # 而後續步驟跑的是第三方程式碼；本管線不需要推回任何東西。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: 安裝 uv
        run: pip install --no-cache-dir "uv==${UV_VERSION}"

      # 用樣板建 .env：順帶證明 .env.example 是完整的——少一個變數，
      # 下面的 make 目標就會失敗（tests/integration/test_infra_config.py 是靜態版，
      # 這裡是實際執行版）。值是佔位字串，CI 環境用完即棄。
      - name: 準備環境變數
        run: cp .env.example .env

      # JWT 簽章金鑰（10 §2.1 的 ES256）。**建 FastAPI app 就會用到它**——
      # api.main → router → dependencies/auth → get_token_codec 在 import 期讀檔，
      # 而金鑰缺檔是 Fail Fast（services/identity/tokens.py，刻意不自動產生）。
      # 因此連「不連 DB 的 unit 層」也需要這一步：OpenAPI 契約漂移檢查會建 app。
      # 1A-3 引入 JWT 時漏掉，CI 自那次起整片紅（由 test_ci_pipeline.py 補上守門）。
      - name: 產生 JWT 簽章金鑰
        run: make gen-jwt-keys

      # 獨立一步而非藏在 lint 裡：鎖檔過期是「改了依賴卻沒提交 lock」的訊號，
      # 值得在 CI 上一眼看到是哪一步紅的。
      # `make lint` 也把 lock-check 列為前置，於是這裡會跑兩次——**刻意保留**：
      # 少了這一步，CI 的紅燈會落在「ruff + mypy」那格，訊息指向錯誤的方向；
      # 少了 lint 的前置，本機 `make lint` 就完全不檢查鎖檔。跑第二次是唯讀且近乎免費。
      - name: uv.lock 與 pyproject 一致
        run: make lock-check

      # `lint-backend` 而不是 `lint`：後者連前端的 eslint + vue-tsc 一起跑（本機一個
      # 指令檢查兩端），而本 job 沒有 setup-node 也沒有 node_modules，會停在
      # `eslint: not found`。前端由下方的 frontend job 跑。
      - name: ruff + mypy + import-linter
        run: make lint-backend

      - name: unit 測試（無外部依賴）
        run: make test-unit

  tests:
    name: integration / api（真實 PG + Redis + MinIO）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: 安裝 uv
        run: pip install --no-cache-dir "uv==${UV_VERSION}"

      - name: 準備環境變數
        run: cp .env.example .env

      # 理由見 quality job 的同名步驟。integration/api 兩層會實際簽發與驗證 token。
      - name: 產生 JWT 簽章金鑰
        run: make gen-jwt-keys

      # 與本機完全相同的一鍵流程：起服務 → statement_timeout → bucket 初始化
      - name: 起基礎設施
        run: make up

      - name: Django migration（含 pgvector / pgroonga extension）
        run: make migrate

      - name: integration 測試
        run: make test-integration

      - name: api 測試
        run: make test-api

      # 服務層的失敗（healthcheck、認證、初始化）從 pytest 的錯誤訊息常看不出來
      - name: 失敗時輸出服務日誌
        if: failure()
        run: docker compose --env-file .env -f docker/compose.yml logs --tail 200

  frontend:
    name: 前端 lint / type / vitest + OpenAPI codegen 同步
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # actions/setup-node v5，釘 commit SHA（同 checkout 的理由）。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      # pnpm 版本不寫在這裡：frontend/package.json 的 packageManager 欄位是唯一來源，
      # corepack 讀它。在 workflow 另外指定一次就會與本機漂開。
      - name: 啟用 pnpm（corepack）
        run: corepack enable pnpm

      # 本 job 也要跑 make openapi（重新匯出契約），那一步是 Python。
      - name: 安裝 uv
        run: pip install --no-cache-dir "uv==${UV_VERSION}"

      - name: 準備環境變數
        run: cp .env.example .env

      # 理由見 quality job 的同名步驟。本 job 的 openapi-check 會重新匯出契約＝建 app。
      - name: 產生 JWT 簽章金鑰
        run: make gen-jwt-keys

      - name: 安裝前端相依
        run: make fe-install

      - name: eslint + vue-tsc
        run: make fe-lint

      - name: vitest（含型別層）
        run: make fe-test

      # 契約治理（09 §4 / 03 §3.1）：重新匯出 schema、重新產生 client，工作區必須乾淨。
      # 後端改了端點卻沒重新產生前端 client 時在此擋下——前後端契約不會默默脫節。
      - name: OpenAPI 契約與 generated client 同步
        run: make openapi-check

  image:
    name: build image + trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # 本 job 不建 app、不跑測試，照理不需要金鑰——**這一步是為了讓下面的 trivy
      # 掃得到東西**。`backend/.secrets/` 在 gitignore 之內，不產生的話 build context
      # 裡根本沒有私鑰，secret 掃描永遠是綠的，而它綠得毫無意義：2026-08-17 發現
      # backend/.dockerignore 漏列 `.secrets/`，所有人本機建的 image 都把 ES256 私鑰
      # 烘了進去，CI 卻一次都沒紅過。守門要能失敗才算守門。
      - name: 產生 JWT 簽章金鑰（讓 trivy 的 secret 掃描有東西可掃）
        run: make gen-jwt-keys

      - name: 建置 backend image
        run: make image BACKEND_IMAGE="${BACKEND_IMAGE}"

      # ADR-007 要求 non-root。這條不是形式檢查：base image 換版或 Dockerfile
      # 重排時 USER 很容易被漏掉，而容器以 root 跑起來不會有任何症狀。
      - name: 驗證 image 以非 root 執行
        run: |
          uid="$(docker run --rm "${BACKEND_IMAGE}" id -u)"
          echo "image uid = ${uid}"
          test "${uid}" != "0"

      # 有修補版本的 HIGH/CRITICAL 直接擋 PR；--ignore-unfixed 避免被無解的
      # base image CVE 永久卡住（那類問題靠升 base image 解，不靠擋 PR）。
      # ⚠️ --ignore-unfixed 只在「有定期升 base image 的流程」下才成立，
      # 否則等同永久忽略；該流程屬 nightly workflow（12 §6.1），尚未建立。
      #
      # ⚠️ 掛載 docker.sock = 把 daemon 的完整控制權交給 trivy 容器。在 GitHub 託管的
      # runner 上，PR 程式碼本來就在同一台拋棄式機器上執行，未擴大攻擊面；
      # **改用 self-hosted runner 時這條必須同時改掉**（`trivy image --input <tar>`
      # 搭配 `docker save`），否則它會從無害變成跨 job 的逃逸路徑。
      - name: trivy 弱點掃描
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY_IMAGE}" image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --no-progress \
              "${BACKEND_IMAGE}"
